server:
  port: 8180
  servlet:
    context-path: /

spring:
  application:
    name: gongsi-backend
  datasource:
    # 최소 권한 계정. DELETE 권한이 없고 users·user_scopes는 읽기만,
    # 감사 테이블(audit_log·guardrail_event·agent_tool_call_log)도 읽기만 된다.
    # DDL 적용은 관리자(root) 계정으로 한다 — 관리자 작업과 런타임 작업의 자격 증명을 나눈다
    url: ${MARIADB_URL:jdbc:mariadb://localhost:3307/gongsi?useUnicode=true&characterEncoding=utf8}
    username: ${MARIADB_USER:gongsi_app}
    password: ${MARIADB_PASSWORD:app-pass}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate            # 스키마는 db/schema/*.sql이 정본. JPA는 맞는지 확인만 한다
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false
    show-sql: false
  jackson:
    time-zone: Asia/Seoul

gongsi:
  jwt:
    secret: ${JWT_SECRET:DEV_ONLY_GONGSI_RADAR_JWT_SECRET_CHANGE_ME_IN_PROD_AT_LEAST_64_BYTES_LONG_0123456789}
    expire-minutes: 60
    refresh-expire-days: 7
  ai-server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8100}
    api-key: ${AI_SERVER_API_KEY:dev-ai-internal-key}
    timeout-seconds: 60
  core:                                                         # 리포트 발행 원장(Core Zone)
    base-url: ${CORE_BASE_URL:http://localhost:9100}
    # [보안] 쓰기용 시스템 키는 Spring에만 있다. AI 서버에는 조회 키(CORE_API_KEY)만 준다
    system-key: ${CORE_SYSTEM_KEY:dev-core-system-key}
    timeout-seconds: 10
  audit:
    # [보안] 감사 기록 전용 계정. audit_log·guardrail_event·agent_tool_call_log에
    #        INSERT와 SELECT만 있고 UPDATE·DELETE가 없다. append-only를 DB 권한이 보장한다.
    #        spring.datasource(애플리케이션 계정)와 반드시 다른 계정이어야 한다
    url: ${MARIADB_AUDIT_URL:jdbc:mariadb://localhost:3307/gongsi?useUnicode=true&characterEncoding=utf8}
    username: ${MARIADB_AUDIT_USER:gongsi_audit}
    password: ${MARIADB_AUDIT_PASSWORD:audit-only-pass}
  data:
    # 데이터 원천: sample(저장소 루트 samples/data의 가상 기업) | opendart(OpenDART + 공공데이터포털 시세)
    source: ${GONGSI_DATA_SOURCE:sample}
    # 샘플 디렉터리. 상대 경로는 실행 위치(backend/) 기준이고, 없으면 위로 올라가며 samples/data를 찾는다
    sample-dir: ${GONGSI_SAMPLE_DIR:../samples/data}
    # OpenDART·공공데이터포털 응답 디스크 캐시(원문 ZIP 영구, 목록·재무는 요청별). backend/.gitignore에 있다
    cache-dir: ${GONGSI_CACHE_DIR:.cache}
    # [보안] 원천 API 키는 Spring에만 둔다. AI 서버는 키 없이 아래 내부 데이터 API로만 받는다
    opendart-api-key: ${OPENDART_API_KEY:}
    data-go-kr-api-key: ${DATA_GO_KR_API_KEY:}     # 공공데이터포털 '디코딩' 키
    peers-file: ${GONGSI_PEERS_FILE:}               # OpenDART 업종 피어 고유번호 목록(JSON 배열). 비우면 피어 없음
    # 적재 DB(#3)를 먼저 읽고 없으면 원천을 부른다. false면 항상 원천
    ingested-read: true
    # 내부 데이터 API(/internal/data/**, AI 서버 → Spring) 키. AI_SERVER_API_KEY와 다른 값이어야 한다
    internal-key: ${DATA_API_KEY:dev-data-internal-key}
  ingest:
    # 일일 수집 예약(Spring cron, Asia/Seoul). "-"(기본)면 꺼짐. 예: "0 30 18 * * MON-FRI"
    cron: ${GONGSI_INGEST_CRON:-}
    # 1회 실행 모드: --gongsi.ingest.run-once=daily|backfill 이면 웹 서버 없이 한 번 돌고 끝난다
    run-once: ${GONGSI_INGEST_RUN_ONCE:}
    budget: ${INGEST_DAILY_BUDGET:15000}         # 실행당 원천 호출 예산(OpenDART 일 20,000건 한도 안에서)
    years: 3                                     # backfill: 회사별로 거슬러 받을 해 수
    documents: true                              # 최근 90일 정기공시 원문 ZIP도 받아 둘지
    # [보안] 적재 테이블 쓰기 전용 계정(SELECT·INSERT·UPDATE, DELETE 없음). 앱 계정(gongsi_app)은 적재 테이블을 읽기만 한다.
    #        수집 작업만 이 커넥션을 쓴다 — DataSource 빈으로 노출하지 않는다(IngestService 참고)
    datasource:
      url: ${MARIADB_INGEST_URL:jdbc:mariadb://localhost:3307/gongsi?useUnicode=true&characterEncoding=utf8}
      username: ${MARIADB_INGEST_USER:gongsi_ingest}
      password: ${MARIADB_INGEST_PASSWORD:ingest-pass}

logging:
  level:
    com.gongsiradar: INFO
    org.springframework.security: INFO
  pattern:
    # MDC에 심어 둔 requestUid를 모든 로그 줄에 붙인다.
    # RequestUidFilter가 요청 시작 때 넣고 끝날 때 지운다. 값이 없으면 '-'로 나온다.
    # 로그에서 찾은 ID로 audit_log·guardrail_event·core_log를 바로 조회할 수 있다
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestUid:--}] %logger{36} - %msg%n"
